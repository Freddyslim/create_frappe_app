name: init_new_app_repo

on:
  workflow_dispatch:
    inputs:
      app-name:
        description: 'Name of the Frappe app to generate'
        required: true

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: recursive

      - name: Add template submodule
        run: |
          if [ ! -d frappe_app_template ]; then
            git submodule add https://github.com/seclution/frappe_app_template frappe_app_template
          fi

      - name: Run setup script
        run: |
          cd frappe_app_template
          ./setup.sh
          cd ..

      - name: Commit setup files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: initial setup" || echo "nothing to commit"
          git push

      - name: Trigger follow-up workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run clone-templates.yml
          gh workflow run clone-vendors.yml
          gh workflow run create-app-folder.yml -f app-name='${{ inputs.app-name }}'
          gh workflow run publish.yml
